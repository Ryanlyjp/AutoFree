[project]
name = "autofree"
version = "0.1.0"
description = "Batch produce ChatGPT Personal free-plan accounts and push auth.json to CLIProxyAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "playwright>=1.40.0",
    "pydantic>=2.6",
    "requests[socks]>=2.28.0",
    "uvicorn[standard]>=0.30",
    "xvfbwrapper>=0.2.9; sys_platform == 'linux'",
]

[project.scripts]
autofree = "autofree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autofree"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["F401", "F811", "F821"]
